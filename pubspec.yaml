name: white_cobalt
description: Media downloader using Cobalt API
version: 0.9.0+31

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  path_provider: ^2.1.5
  permission_handler: ^11.0.0
  flutter_downloader: ^1.11.4
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.1.0
  url_launcher: ^6.1.10
  fl_chart: ^1.0.0
  media_scanner: ^2.2.0
  card_loading: ^0.3.2
  package_info_plus: ^4.2.0
  flutter_markdown: ^0.7.4+1
  easy_localization: ^3.0.8
  flutter_localized_locales: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  fonts:
    - family: NotoSansMono
      fonts:
        - asset: assets/fonts/NotoSansMono.ttf
          style: normal
          weight: 400
  # Translations are compiled into lib/generated/codegen_loader.g.dart, so
  # assets/translations/ is intentionally NOT bundled (it was shipped twice).
  # Regenerate after editing JSON:
  #   dart run easy_localization:generate -S assets/translations -f keys -o codegen_loader_keys.g.dart
  #   dart run easy_localization:generate -S assets/translations
  assets:
    - assets/heart/Heart Lisa.svg
    - assets/photos/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/Heart.png"
  adaptive_icon_foreground: "assets/icon/Heart.png"
  min_sdk_android: 16
  adaptive_icon_background: "#000000"
  adaptive_icon_monochrome: "assets/icon/Heart.png"